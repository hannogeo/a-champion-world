<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | A Champion World</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/hannog.ico">
</head>
<body data-page="login">
    <div id="global-loader" style="display:none;"><div class="spinner"></div></div>

    <nav>
        <div class="container nav-content">
            <a href="index.html" class="logo">A <span>CHAMPION</span> WORLD</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="info.html">Map Info</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><button id="theme-toggle" class="theme-toggle" aria-label="Toggle Theme"></button></li>
            </ul>
        </div>
    </nav>

    <div style="height: 100vh; display: flex; justify-content: center; align-items: center; background: var(--bg-primary);">
        <div class="login-box">
            <h2 style="margin-bottom: 0.5rem;">Admin Login</h2>
            <p style="margin-bottom: 1.5rem; color: var(--text-secondary); font-size: 0.9rem;">Sign in to manage the map</p>
            <div id="error-message" style="color: #ef4444; margin-bottom: 1rem; display: none;"></div>
            <form id="login-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { auth } from "./js/firebase-config.js";
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = e.target.querySelector('button');
            btn.disabled = true;
            btn.innerText = 'Signing in...';
            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = 'index.html';
            } catch (err) {
                const errDiv = document.getElementById('error-message');
                errDiv.innerText = err.message;
                errDiv.style.display = 'block';
                btn.disabled = false;
                btn.innerText = 'Sign In';
            }
        });
    </script>
    <script src="js/theme.js"></script>
</body>
</html>
