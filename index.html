<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Champion World</title>
    <meta name="description" content="Explore the country distribution and other information for the A Champion World GeoGuessr map.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/hannog.ico">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body data-page="index">
    <div id="global-loader"><div class="spinner"></div></div>
    <nav>
        <div class="container nav-content">
            <a href="index.html" class="logo">A <span>CHAMPION</span> WORLD</a>
            <ul class="nav-links">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="#distribution">Distribution</a></li>
                <li><a href="info.html">Map Info</a></li>
                <li><a href="report.html">Report</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><button id="theme-toggle" class="theme-toggle" aria-label="Toggle Theme"></button></li>
            </ul>
        </div>
    </nav>

    <header class="hero">
        <div class="container">
            <h1 data-content-id="heroTitle" style="min-height: 3rem;"></h1>
            <p data-content-id="heroDesc" style="min-height: 1.2rem;"></p>
            <div class="hero-btns">
                <a href="https://www.geoguessr.com/maps/696f4c53d53961f07bf239bd" class="btn btn-primary" target="_blank" rel="noopener noreferrer" style="font-weight: 600;">PLAY NOW</a>
            </div>
        </div>
    </header>

    <main class="container">
        <section id="distribution" class="stats-header">
            <div class="stats-title">
                <h2 data-content-id="distTitle" style="min-height: 2rem;"></h2>
                <p data-content-id="distSub" style="min-height: 1.2rem;"></p>
                <div class="total-locations-badge">
                    <span class="badge-label">Total Locations:</span>
                    <span class="badge-value" id="totalLocationsDisplay"></span>
                </div>
            </div>
            <div class="controls-container">
                <div class="view-toggle">
                    <button id="show-list" class="active">List</button>
                    <button id="show-map">Map</button>
                </div>
                <div class="search-container">
                    <svg class="search-icon" width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <input type="text" id="countrySearch" placeholder="Search by name or code...">
                </div>
                <select id="sortSelect" class="sort-select">
                    <option value="amount-desc">Amount (High to Low)</option>
                    <option value="amount-asc">Amount (Low to High)</option>
                    <option value="name-asc">Name (A-Z)</option>
                    <option value="name-desc">Name (Z-A)</option>
                </select>
            </div>
        </section>

        <div id="mapView" style="height: 600px; width: 100%; border: 2px solid var(--border-dim); margin-bottom: 6rem; display: none; background: var(--bg-card); box-shadow: var(--shadow-offset) var(--shadow-offset) 0px var(--border-dim); position: relative; z-index: 1;"></div>

        <section class="country-grid" id="countryGrid">
            <!-- Dynamically populated via script.js -->
        </section>
    </main>

    <script type="module" src="js/script.js"></script>
    <script type="module" src="js/content-manager.js"></script>
    <script src="js/theme.js"></script>
</body>
</html>
