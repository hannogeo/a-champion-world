<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Champion World</title>
    <meta name="description" content="Explore the country distribution and other information for the A Champion World GeoGuessr map.">
    <meta name="keywords" content="GeoGuessr, A Champion World, GeoGuessr Map, Country Distribution, Map Stats, Location Reporting, HannoGeo">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/hannog.ico">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body data-page="index">
    <div id="global-loader"><div class="spinner"></div></div>
    <nav>
        <div class="container nav-content">
            <a href="index.html" class="logo">A <span>CHAMPION</span> WORLD</a>
            <ul class="nav-links">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="#distribution">Distribution</a></li>
                <li><a href="info.html">Map Info</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li style="display:none;" id="admin-nav-item"><a href="admin.html">Admin Panel</a></li>
                <li style="display:none;" id="logout-nav-item"><button id="logout-btn" class="logout-btn">Logout</button></li>
                <li><button id="theme-toggle" class="theme-toggle" aria-label="Toggle Theme"></button></li>
            </ul>
        </div>
    </nav>

    <header class="hero">
        <div class="hero-bg">
            <div class="hero-glow"></div>
        </div>
        <div class="container">
            <h1 data-content-id="heroTitle" style="min-height: 3rem;"></h1>
            <p data-content-id="heroDesc" style="min-height: 1.2rem;"></p>
            <div class="hero-btns">
                <a href="https://www.geoguessr.com/maps/696f4c53d53961f07bf239bd" class="btn btn-primary" target="_blank" rel="noopener noreferrer">PLAY NOW</a>
            </div>
        </div>
    </header>

    <main class="container">
        <section id="distribution" class="stats-header">
            <div class="stats-title">
                <h2 data-content-id="distTitle" style="min-height: 2rem;"></h2>
                <p data-content-id="distSub" style="min-height: 1.2rem;"></p>
                <div class="total-locations-badge">
                    <span class="badge-label">Total Locations:</span>
                    <span class="badge-value" id="totalLocationsDisplay"></span>
                </div>
            </div>
            <div class="controls-container">
                <div class="view-toggle">
                    <button id="show-list" class="active">List</button>
                    <button id="show-map">Map</button>
                </div>
                <div class="search-container">
                    <svg class="search-icon" width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <input type="text" id="countrySearch" placeholder="Search by name or code...">
                </div>
                <select id="sortSelect" class="sort-select">
                    <option value="amount-desc">Amount (High to Low)</option>
                    <option value="amount-asc">Amount (Low to High)</option>
                    <option value="name-asc">Name (A-Z)</option>
                    <option value="name-desc">Name (Z-A)</option>
                </select>
            </div>
        </section>

        <div id="mapView"></div>

        <section class="country-grid" id="countryGrid">
            <!-- Dynamically populated via script.js -->
        </section>
    </main>

    <script type="module">
        import { auth, db } from "./js/firebase-config.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

        const adminNav = document.getElementById('admin-nav-item');
        const logoutNav = document.getElementById('logout-nav-item');
        const logoutBtn = document.getElementById('logout-btn');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                adminNav.style.display = '';
                logoutNav.style.display = '';
            } else {
                adminNav.style.display = 'none';
                logoutNav.style.display = 'none';
            }
        });

        logoutBtn?.addEventListener('click', () => signOut(auth));

        // Custom dropdown for sort select
        (function() {
            const select = document.getElementById('sortSelect');
            if (!select) return;

            const wrapper = document.createElement('div');
            wrapper.className = 'custom-select-wrapper';

            const trigger = document.createElement('div');
            trigger.className = 'custom-select-trigger';
            trigger.innerHTML = `${select.options[select.selectedIndex].text} <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

            const menu = document.createElement('div');
            menu.className = 'custom-select-menu';

            Array.from(select.options).forEach((opt, i) => {
                const div = document.createElement('div');
                div.className = 'custom-select-option' + (opt.selected ? ' selected' : '');
                div.textContent = opt.text;
                div.dataset.value = opt.value;
                div.addEventListener('click', () => {
                    select.value = opt.value;
                    select.dispatchEvent(new Event('change'));
                    trigger.innerHTML = `${opt.text} <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
                    menu.querySelectorAll('.custom-select-option').forEach(o => o.classList.remove('selected'));
                    div.classList.add('selected');
                    menu.classList.remove('open');
                    trigger.classList.remove('open');
                });
                menu.appendChild(div);
            });

            trigger.addEventListener('click', (e) => {
                e.stopPropagation();
                const isOpen = menu.classList.toggle('open');
                trigger.classList.toggle('open', isOpen);
            });

            document.addEventListener('click', () => {
                menu.classList.remove('open');
                trigger.classList.remove('open');
            });

            wrapper.appendChild(trigger);
            wrapper.appendChild(menu);
            select.parentNode.insertBefore(wrapper, select.nextSibling);
        })();
    </script>
    <script type="module" src="js/script.js"></script>
    <script type="module" src="js/content-manager.js"></script>
    <script src="js/theme.js"></script>
</body>
</html>
