<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Info | A Champion World</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/hannog.ico">
</head>
<body data-page="info">
    <div id="global-loader"><div class="spinner"></div></div>
    <nav>
        <div class="container nav-content">
            <a href="index.html" class="logo">A <span>CHAMPION</span> WORLD</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#distribution">Distribution</a></li>
                <li><a href="info.html" class="active">Map Info</a></li>
                <li><a href="report.html">Report</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li style="display:none;" id="admin-nav-item"><a href="admin-panel.html" style="position:relative;">Admin Panel <span id="report-badge" style="display:none; position:absolute; top:-8px; right:-18px; background:#ef4444; color:white; font-size:0.65rem; padding:2px 6px; border-radius:10px; font-weight:800;">0</span></a></li>
                <li style="display:none;" id="logout-nav-item"><button id="logout-btn" style="font-size:0.8rem; padding:0.5rem 1rem; background:#ef4444; color:white; border:none; font-weight:700; text-transform:uppercase; cursor:pointer;">Logout</button></li>
                <li><button id="theme-toggle" class="theme-toggle" aria-label="Toggle Theme"></button></li>
            </ul>
        </div>
    </nav>

    <main class="container" style="padding-top: 120px; padding-bottom: 100px;">
        <h1 data-content-id="mainTitle" style="font-size: 3rem; font-weight: 700; margin-bottom: 2rem; letter-spacing: -0.05em; min-height: 3rem;"></h1>
        
        <div style="background: var(--bg-card); padding: 3rem; border-radius: var(--radius-xl); border: 1px solid var(--border-dim); max-width: 800px; margin: 0 auto; line-height: 1.8;">
            <p data-content-id="desc1" style="color: var(--text-secondary); margin-bottom: 2rem; font-size: 1.0rem; min-height: 1.2rem;"></p>
            
            <h3 data-content-id="heading1" style="color: var(--text-primary); margin-bottom: 1rem; font-size: 1.5rem; min-height: 1.5rem;"></h3>
            <p data-content-id="desc2" style="color: var(--text-secondary); margin-bottom: 2rem; min-height: 1.2rem;"></p>

            <h3 data-content-id="heading2" style="color: var(--text-primary); margin-bottom: 1rem; font-size: 1.5rem; min-height: 1.5rem;"></h3>
            <p data-content-id="desc3" style="color: var(--text-secondary); margin-bottom: 2rem; min-height: 1.5rem;"></p>

            <h3 data-content-id="heading3" style="color: var(--text-primary); margin-bottom: 1rem; font-size: 1.5rem; min-height: 1.5rem;"></h3>
            <p data-content-id="desc4" style="color: var(--text-secondary); min-height: 1.5rem;"></p>
        </div>
        
        <div style="text-align: center; margin-top: 4rem;">
            <a href="index.html" class="btn btn-primary">Back to Home</a>
        </div>
    </main>
    <script type="module">
        import { auth, db } from "./js/firebase-config.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
        import { collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

        const adminNav = document.getElementById('admin-nav-item');
        const logoutNav = document.getElementById('logout-nav-item');
        const logoutBtn = document.getElementById('logout-btn');
        const badge = document.getElementById('report-badge');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                adminNav.style.display = '';
                logoutNav.style.display = '';
            } else {
                adminNav.style.display = 'none';
                logoutNav.style.display = 'none';
                badge.style.display = 'none';
            }
        });

        logoutBtn?.addEventListener('click', () => signOut(auth));

        const q = query(collection(db, "reports"), where("status", "==", "unresolved"));
        onSnapshot(q, (snapshot) => {
            const count = snapshot.size;
            if (count > 0) {
                badge.innerText = count;
                badge.style.display = '';
            } else {
                badge.style.display = 'none';
            }
        });
    </script>
    <script type="module" src="js/content-manager.js"></script>
    <script src="js/theme.js"></script>
</body>
</html>
